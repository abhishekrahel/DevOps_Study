name: Application Deployment 

on:
  # push:
  #   branches:
  #     - main
  #     - dev
  workflow_dispatch:

jobs:
  app_deploy:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: dev
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: 449957914366
      ECR_REPOSITORY: dev-nginx-repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Image
        run: docker build -f Projects/Docker_ECR/Dockerfile -t web_server Projects/Docker_ECR

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Image
        run: |
          docker tag web_server:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY

      - name: Push Image
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name ${ENVIRONMENT}-eks-cluster

      - name: Deploy to EKS
        run: |
          kubectl apply -f Projects/EKS-Cluster/Kubernetes/namespace.yml
          kubectl apply -f Projects/EKS-Cluster/Kubernetes/deployment.yml
          kubectl apply -f Projects/EKS-Cluster/Kubernetes/service.yml

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/html-app -n qa
          kubectl get pods -n qa
          kubectl get svc -n qa
          kubectl describe deployment html-app -n qa

