name: Terraform Deployment using tfsec

on:
    push:
      branches:
        - main
        - dev
    workflow_dispatch:     

jobs:
  terraform:

  
    name: Terraform tfsec
    runs-on: ubuntu-latest

    defaults:
      run:
       working-directory: Projects/Terraform/pipeline-test

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive 

      - name: Terraform Validate
        run: terraform validate

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Projects/Terraform/pipeline-test

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var-file=input.tfvars

      

      

terraform-apply:

    needs: terraform-plan
    runs-on: ubuntu-latest

    environment:
      name: production

    defaults:
      run:
        working-directory: Projects/Terraform/pipeline-test

    steps:  

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: Projects/Terraform/pipeline-test


      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply --auto-approve tfplan


        