name: Application Deployment AI

on:
  # push:
  #   branches:
  #     - main
  #     - dev
  workflow_dispatch:

jobs:
  app_deploy:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: dev
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: 449957914366
      ECR_REPOSITORY: dev-nginx-repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Image
        run: docker build -f Projects/Docker_ECR/Dockerfile -t web_server Projects/Docker_ECR

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Image
        run: |
          docker tag web_server:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY

      - name: Push Image
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name ${ENVIRONMENT}-eks-cluster

      - name: Deploy to EKS
        run: |
          kubectl apply -f Projects/Kubernetes/namespace.yml
          kubectl apply -f Projects/Kubernetes/deployment.yml
          kubectl apply -f Projects/Kubernetes/service.yml

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/html-app -n qa
          kubectl get pods -n qa
          kubectl get svc -n qa
          kubectl describe deployment html-app -n qa

      - name: Collect Kubernetes Status
        run: |
          kubectl get nodes -o json > nodes.json
          kubectl get pods -A -o json > pods.json
          kubectl get svc -A -o json > services.json

      - name: Generate Deployment Summary
        run: |
          NODE_COUNT=$(jq '.items | length' nodes.json)
          READY_NODES=$(jq '[.items[] | select(.status.conditions[] | select(.type=="Ready" and .status=="True"))] | length' nodes.json)
          POD_COUNT=$(jq '.items | length' pods.json)
          RUNNING_PODS=$(jq '[.items[] | select(.status.phase=="Running")] | length' pods.json)
          SERVICE_COUNT=$(jq '.items | length' services.json)

          {
            echo "# 🚀 Application Deployment Summary"
            echo ""
            echo "## Deployment Status"
            echo "- ✅ Kubernetes Deployment: Successful"
            echo "- 🌍 Environment: dev"
            echo ""
            echo "## Kubernetes Details"
            echo "| Resource | Value |"
            echo "|----------|-------|"
            echo "| Total Nodes | $NODE_COUNT |"
            echo "| Ready Nodes | $READY_NODES |"
            echo "| Total Pods | $POD_COUNT |"
            echo "| Running Pods | $RUNNING_PODS |"
            echo "| Services | $SERVICE_COUNT |"
            echo ""
            echo "## Next Steps"
            echo "- Verify application URL"
            echo "- Monitor pod logs"
            echo "- Check service accessibility"
          } > summary.md

      - name: Publish Deployment Summary
        run: |
          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Verify OpenAI Secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ Secret not found"
            exit 1
          else
            echo "✅ OpenAI Secret Found"
          fi

      - name: Create AI Prompt
        run: |
          cat <<EOF > prompt.txt
          You are a Senior Kubernetes and DevOps Engineer reviewing a GitHub Actions deployment.

          Environment: Development (dev)

          Analyze ONLY the Kubernetes information provided below.

          Do NOT ask for additional files.

          If information cannot be inferred, simply state:
          "Not enough information available."

          Return markdown with these sections only:

          # 🚀 Deployment Summary
          Maximum 4 bullet points.

          # ✅ Health Assessment
          Maximum 4 bullet points.

          # ⚠️ Risks
          Maximum 3 bullet points.

          # 💡 Recommendations
          Maximum 5 bullet points.

          Kubernetes Nodes:
          EOF

          cat nodes.json >> prompt.txt

          echo "" >> prompt.txt
          echo "Kubernetes Pods:" >> prompt.txt
          cat pods.json >> prompt.txt

          echo "" >> prompt.txt
          echo "Kubernetes Services:" >> prompt.txt
          cat services.json >> prompt.txt

      - name: Generate AI Deployment Summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PROMPT=$(cat prompt.txt)

          curl -s https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg model "gpt-5-mini" \
              --arg input "$PROMPT" \
              '{model:$model,input:$input}')}" \
            > ai_response.json

      - name: Extract AI Summary
        run: |
          jq -r '
            .output[]
            | select(.type=="message")
            | .content[]
            | select(.type=="output_text")
            | .text
          ' ai_response.json > ai_summary.md

      - name: Publish AI Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "# 🤖 AI Kubernetes Assessment" >> $GITHUB_STEP_SUMMARY
          cat ai_summary.md >> $GITHUB_STEP_SUMMARY