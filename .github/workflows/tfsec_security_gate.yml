name: Terraform Deployment using tfsec---AI assisted 

on:
    push:
      branches:
        - main
        - dev
    workflow_dispatch:     

jobs:
  terraform:

  
    name: Terraform tfsec---AI
    runs-on: ubuntu-latest

    defaults:
      run:
       working-directory: Projects/Terraform/Pipelines/pipeline-test

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          ls -la "$GITHUB_WORKSPACE"
          echo "Projects:"
          ls -la "$GITHUB_WORKSPACE/Projects"  

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Check Terraform Project Structure
        run: |
            echo "Terraform directories:"
            find "$GITHUB_WORKSPACE/Projects/Terraform" -maxdepth 3 -type d -print

            echo ""
            echo "pipeline-test directories:"
            find "$GITHUB_WORKSPACE/Projects" -type d -name "pipeline-test" -print

      - name: Terraform Format Check
        run: terraform fmt -check -recursive 

      - name: Terraform Validate
        run: terraform validate

      
      # - name: Install tfsec
      #   run: |
      #     curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Install tfsec
        run: |
          wget -q https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec_1.28.11_linux_amd64.tar.gz
          tar -xzf tfsec_1.28.11_linux_amd64.tar.gz
          sudo mv tfsec /usr/local/bin/tfsec
          tfsec --version

      - name: Run tfsec Security Scan
        run: |
          tfsec . --format json > tfsec-results.json

      - name: Display tfsec Results
        run: |
          cat tfsec-results.json
      
       
      - name: Create Final Prompt
        run: |
           cat "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/prompts/prompt.md" > "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/final-prompt.txt"
           echo "" >> "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/final-prompt.txt" 
           cat tfsec-results.json "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/final-prompt.txt"  

      - name: Display Final Prompt
        run: |
          cat "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/final-prompt.txt"     

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var-file=input.tfvars

      - name: Verify tfsec Results and Final Prompt
        run: |
          echo "===== tfsec result file ====="
          ls -lh tfsec-results.json
          cat tfsec-results.json

          echo ""
          echo "===== final-prompt.txt ====="
          ls -lh "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/final-prompt.txt"
          tail -20 "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/final-prompt.txt"
    

    # - name: Manual Approval
    #   uses: trstringer/manual-approval@v1
    #   with:
    #     secret: ${{ secrets.GITHUB_TOKEN }}
    #     approvers: abhishekrahel

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply --auto-approve tfplan

      # - name: Terraform Apply
      #   run: terraform apply -auto-approve tfplan

