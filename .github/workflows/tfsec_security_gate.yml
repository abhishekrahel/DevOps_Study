name: Terraform Deployment using tfsec---AI assisted 

on:
    push:
      branches:
        - main
        - dev
    workflow_dispatch:     

jobs:
  terraform:

  
    name: Terraform tfsec---AI
    runs-on: ubuntu-latest

    defaults:
      run:
       working-directory: Projects/Terraform/Pipelines/pipeline-test

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          ls -la "$GITHUB_WORKSPACE"
          echo "Projects:"
          ls -la "$GITHUB_WORKSPACE/Projects"  

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Check Terraform Project Structure
        run: |
            echo "Terraform directories:"
            find "$GITHUB_WORKSPACE/Projects/Terraform" -maxdepth 3 -type d -print

            echo ""
            echo "pipeline-test directories:"
            find "$GITHUB_WORKSPACE/Projects" -type d -name "pipeline-test" -print

      - name: Terraform Format Check
        run: terraform fmt -check -recursive 

      - name: Terraform Validate
        run: terraform validate

      
      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec Security Scan
        run: |
          tfsec . --format json > tfsec-results.json

      - name: Display tfsec Results
        run: |
          cat tfsec-results.json
      
      - name: Create Final Prompt
        run: |
          cat prompts/prompt.md > final-prompt.txt
          echo "" >> final-prompt.txt
          cat tfsec-results.json >> final-prompt.txt 
          
      - name: Display Final Prompt
        run: |
          cat final-prompt.txt    

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var-file=input.tfvars
    

    # - name: Manual Approval
    #   uses: trstringer/manual-approval@v1
    #   with:
    #     secret: ${{ secrets.GITHUB_TOKEN }}
    #     approvers: abhishekrahel

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply --auto-approve tfplan

      # - name: Terraform Apply
      #   run: terraform apply -auto-approve tfplan

