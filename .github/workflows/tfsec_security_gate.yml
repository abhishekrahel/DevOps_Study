name: Terraform Deployment using tfsec - AI assisted

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform tfsec - AI
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: Projects/Terraform/Pipelines/pipeline-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          ls -la "$GITHUB_WORKSPACE"
          echo "Projects:"
          ls -la "$GITHUB_WORKSPACE/Projects"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Check Terraform Project Structure
        run: |
          echo "Terraform directories:"
          find "$GITHUB_WORKSPACE/Projects/Terraform" -maxdepth 3 -type d -print
          echo ""
          echo "pipeline-test directories:"
          find "$GITHUB_WORKSPACE/Projects" -type d -name "pipeline-test" -print

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Install tfsec
        run: |
          wget -q https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec_1.28.11_linux_amd64.tar.gz
          tar -xzf tfsec_1.28.11_linux_amd64.tar.gz
          sudo mv tfsec /usr/local/bin/tfsec
          tfsec --version

      - name: Run tfsec Security Scan
        run: |
          tfsec . --format json > tfsec-results.json  || true

      - name: Display tfsec Results
        run: cat tfsec-results.json

      - name: Create Final Prompt
        run: |
          PROMPT_FILE="$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/prompts/prompt.md"
          FINAL_PROMPT="$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/final-prompt.txt"

          echo "Prompt file:"
          ls -lh "$PROMPT_FILE"

          echo "tfsec result file:"
          ls -lh tfsec-results.json

          echo "Creating final prompt..."

          cat "$PROMPT_FILE" > "$FINAL_PROMPT"
          echo "" >> "$FINAL_PROMPT"
          cat tfsec-results.json >> "$FINAL_PROMPT"

          echo "Final prompt created:"
          ls -lh "$FINAL_PROMPT"

          echo ""
          echo "===== LAST 20 LINES ====="
          tail -20 "$FINAL_PROMPT"

      - name: Display Final Prompt
        run: cat "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/final-prompt.txt"

      - name: Generate AI Security Analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PROMPT_FILE="$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/final-prompt.txt"
          OUTPUT_FILE="$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/ai_response.json"

          if [ ! -f "$PROMPT_FILE" ]; then
            echo "Prompt file not found: $PROMPT_FILE" >&2
            exit 1
          fi

          PROMPT=$(cat "$PROMPT_FILE")

          jq -n \
            --arg model "gpt-5-mini" \
            --arg input "$PROMPT" \
            '{model: $model, input: $input}' > request.json

          curl -s https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > "$OUTPUT_FILE"

      - name: Extract AI Security Report
        run: |
          cd "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment"
          python - <<'PY'
          import json
          from pathlib import Path

          input_path = Path("ai_response.json")
          output_path = Path("ai_report.md")

          if input_path.exists():
              data = json.loads(input_path.read_text(encoding="utf-8"))
              text_parts = []
              for item in data.get("output", []):
                  if item.get("type") == "message":
                      for content in item.get("content", []):
                          if content.get("type") == "output_text":
                              text_parts.append(content.get("text", ""))
              output_path.write_text("\n".join(text_parts), encoding="utf-8")
          else:
              output_path.write_text("AI response file not found.", encoding="utf-8")
          PY

      - name: Display AI Security Report
        run: |
          cat "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/ai_report.md"

      - name: Publish AI Security Assessment
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "# 🤖 AI Terraform Security Assessment" >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/ai_report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var-file=input.tfvars

      - name: Display AI Response
        run: |
          cat "$GITHUB_WORKSPACE/Projects/CI-CD/GitHub-Actions/AI/AI_Security_Assessment/ai_response.json"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply --auto-approve tfplan

