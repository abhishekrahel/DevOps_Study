name: Provision AWS Infrastructure_v2.1

on:
  # push:
  #   branches:
  #     - master
  workflow_dispatch:

jobs:
  infra_terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Projects/EKS-Cluster

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var-file="input.tfvars"

      # - name: Manual Approval
      #   uses: trstringer/manual-approval@v1
      #   with:
      #     secret: ${{ secrets.GITHUB_TOKEN }}
      #     approvers: abhishekrahel

      - name: Terraform Apply
        run: terraform apply --auto-approve tfplan

      - name: Collect Terraform Outputs
        run: terraform output -json > terraform_output.json

      - name: Display Terraform Outputs
        run: |
          echo "========== Terraform Outputs =========="
          cat terraform_output.json

      - name: Generate Deployment Summary
        run: |
          CLUSTER_NAME=$(jq -r '.cluster_name.value' terraform_output.json)
          CLUSTER_ENDPOINT=$(jq -r '.cluster_endpoint.value' terraform_output.json)
          NODE_GROUP=$(jq -r '.node_group_name.value' terraform_output.json)
          VPC_ID=$(jq -r '.vpc_id.value' terraform_output.json)
          PUBLIC_SUBNETS=$(jq '.public_subnets.value | length' terraform_output.json)
          PRIVATE_SUBNETS=$(jq '.private_subnets.value | length' terraform_output.json)

          {
            echo "# 🚀 Infrastructure Deployment Summary"
            echo ""
            echo "## Deployment Status"
            echo "- ✅ Terraform Apply: Successful"
            echo "- 🌍 Environment: dev"
            echo ""
            echo "## Infrastructure Details"
            echo "| Resource | Value |"
            echo "|----------|-------|"
            echo "| Cluster Name | $CLUSTER_NAME |"
            echo "| Node Group | $NODE_GROUP |"
            echo "| VPC ID | $VPC_ID |"
            echo "| Public Subnets | $PUBLIC_SUBNETS |"
            echo "| Private Subnets | $PRIVATE_SUBNETS |"
            echo ""
            echo "## Cluster Endpoint"
            echo "\`$CLUSTER_ENDPOINT\`"
            echo ""
            echo "## Next Steps"
            echo "- Verify EKS node status"
            echo "- Deploy application"
            echo "- Check kubectl connectivity"
          } > summary.md

      - name: Publish Deployment Summary
        run: |
          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Verify OpenAI Secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
          echo "❌ Secret not found"
          exit 1
          else
          echo "✅ OpenAI Secret Found"
          fi
             