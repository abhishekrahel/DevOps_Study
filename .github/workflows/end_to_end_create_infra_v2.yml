name: Provision AWS Infrastructure_v2

on:
  # push:
  #   branches:
  #     - master
  workflow_dispatch:     

jobs:
  infra_terraform:

  
    
    runs-on: ubuntu-latest

    defaults: 
      run:
        working-directory: Projects/EKS-Cluster

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init 
        run: terraform init

      - name: Terraform Format Check 
        run: terraform fmt -check

      - name: Terraform Validate 
        run: terraform validate

      - name: Terraform Plan 
        run: terraform plan -out=tfplan -var-file="input.tfvars"

    # - name: Manual Approval
    #   uses: trstringer/manual-approval@v1
    #   with:
    #     secret: ${{ secrets.GITHUB_TOKEN }}
    #     approvers: abhishekrahel

      - name: Terraform Apply      
        run: terraform apply --auto-approve tfplan

      - name: Collect Terraform Outputs
        run: terraform output -json > terraform_output.json

      - name: Display Terraform Outputs
        run: |
             echo "========== Terraform Outputs =========="
             cat terraform_output.json

      - name: Generate Deployment Summary
        run: |
             echo "# Infrastructure Deployment Summary" > summary.md
             echo "" >> summary.md

             echo "## Deployment Status" >> summary.md
             echo "- ✅ Terraform Apply: Successful" >> summary.md
             echo "- 🌍 Environment: dev" >> summary.md
             echo "" >> summary.md

             echo "## Terraform Outputs" >> summary.md
             echo '```' >> summary.md
             cat  terraform_output.json >> summary.md
             echo '```' >> summary.md

             echo "" >> summary.md
             echo "## Next Steps" >> summary.md
             echo "- Verify EKS cluster status" >> summary.md
             echo "- Deploy application" >> summary.md

      - name: Publish Deployment Summary
        run: |
             cat summary.md >> $GITHUB_STEP_SUMMARY
             