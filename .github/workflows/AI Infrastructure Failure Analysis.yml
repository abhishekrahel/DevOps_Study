name: AI powered failure analysis

on:
  # push:
  #   branches:
  #     - master
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simulate Infrastructure Failure"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  infra_failure_analysis:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Projects/EKS-Cluster/Terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Repository
        run: |
          echo "==========================="
          echo "Current directory"
          pwd

          echo ""
          echo "Contents"
          ls -la

          echo ""
          echo "Terraform tree"
          ls -R ../../Terraform

          echo ""
          echo "main.tf"
          cat main.tf

          echo ""
          echo "Module sources"
          grep -n "source" main.tf

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Clean Terraform
        run: |
          rm -rf .terraform
          rm -f .terraform.lock.hcl

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Debug before plan
        run: |
          echo "Current Directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Looking for input.tfvars:"
          find . -name "input.tfvars"

      - name: Simulate Failure
        if: ${{ inputs.simulate_failure == 'true' }}
        run: |
          sed -i 's/t3.small/t3.invalid/' input.tfvars

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var-file="input.tfvars"

      # - name: Manual Approval
      #   uses: trstringer/manual-approval@v1
      #   with:
      #     secret: ${{ secrets.GITHUB_TOKEN }}
      #     approvers: abhishekrahel

      - name: Terraform Apply
        id: tf_apply
        continue-on-error: true
        run: |
          terraform apply -auto-approve tfplan 2>&1 | tee terraform_error.log

      - name: Check Terraform Result
        if: always()
        run: |
          if grep -q "Apply complete!" terraform_error.log; then
            echo "Terraform Apply Successful"
          else
            echo "Terraform Apply Failed"
            exit 1
          fi

      - name: Create Failure Prompt
        if: failure()
        run: |
          cat <<EOF > failure_prompt.txt
          You are a Senior AWS DevOps Engineer.

          Analyze the following Terraform deployment failure.

          Return markdown with:


          ## Root Cause

          ...

          ## Why it happened

          ...

          ## Recommended Fix

          ...

          ## Verification Commands

          ...

          Terraform Error:

          EOF

          cat terraform_error.log >> failure_prompt.txt

      - name: Generate AI Failure Analysis
        if: failure()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PROMPT=$(cat failure_prompt.txt)

          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg model "gpt-5-mini" \
              --arg input "$PROMPT" \
              '{
                model: $model,
                input: $input
              }')" \
            > ai_response.json

      - name: Show AI Response
        if: failure()
        run: |
          echo "======================"
          cat ai_response.json
          echo "======================"

      - name: Extract AI Summary
        if: failure()
        run: |
          jq -r '
            .output[]
            |  select(.type=="message")
            |  .content[]
            |  select(.type=="output_text")
            |  .text
          ' ai_response.json > ai_failure.md

          echo "===== Extracted ====="
          cat ai_failure.md

      - name: Publish AI Failure Analysis
        if: failure()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "# 🤖 AI Infrastructure Failure Analysis" >> $GITHUB_STEP_SUMMARY
          cat ai_failure.md >> $GITHUB_STEP_SUMMARY



      